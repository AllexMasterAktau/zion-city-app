function calculateAnnualIncome(tokens) {
    const cleanTokens = Math.max(1, Math.min(5000, Math.round(Number(tokens) || 1)));
    return Math.round(cleanTokens * revenuePerToken);
}

function calculateBuyCost(tokens) {
    const cleanTokens = Math.max(1, Math.min(5000, Math.round(Number(tokens) || 1)));
    const usdTotal = cleanTokens * currentTokenPriceUsd;
    const rubTotal = Math.round(usdTotal * usdRubRate);
    return { cleanTokens, usdTotal, rubTotal };
}

function formatUsd(val) {
    const num = Number(val) || 0;
    return Number.isInteger(num)
        ? `$${num.toLocaleString('ru-RU')}`
        : `$${num.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
}

function nextStep() {

function prevStep() {
    if (window.Telegram?.WebApp?.HapticFeedback) {
        window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
    }
    if (currentStep > 1) {
        currentStep--;
        render();
    }
}

function toggleMenu() {
    isMenuOpen = !isMenuOpen;
    render();

    currentStep = 10;
    render();

function updateTokens(val) {

    tokenCount = parsed;
    const tokenLabel = document.getElementById('tokenCountLabel');
    const incomeLabel = document.getElementById('incomeValueLabel');
    if (tokenLabel && incomeLabel) {
        tokenLabel.textContent = `${tokenCount} ALTYN`;
        incomeLabel.textContent = `$${calculateAnnualIncome(tokenCount).toLocaleString('ru-RU')}`;

        render();
    }
}

function refreshBuyCalculatorUi(syncInputs = false) {
    const cost = calculateBuyCost(buyTokenCount);
    const labelEl = document.getElementById('buyTokensLabel');
    const usdEl = document.getElementById('buyUsdLabel');
    const rubEl = document.getElementById('buyRubLabel');
    const rateInfoEl = document.getElementById('rateInfoLabel');

    if (labelEl) labelEl.textContent = `${cost.cleanTokens} ALTYN`;
    if (usdEl) usdEl.textContent = formatUsd(cost.usdTotal);
    if (rubEl) rubEl.textContent = `${cost.rubTotal.toLocaleString('ru-RU')} ₽`;
    if (rateInfoEl) rateInfoEl.textContent = `Курс USD/RUB (${rateSourceLabel}):`;

    if (syncInputs) {
        const numInput = document.getElementById('buyTokensInput');
        const rangeInput = document.getElementById('buyTokensRange');
        const rateInput = document.getElementById('usdRateInput');
        if (numInput && document.activeElement !== numInput) numInput.value = cost.cleanTokens;
        if (rangeInput) rangeInput.value = cost.cleanTokens;
        if (rateInput && document.activeElement !== rateInput) rateInput.value = usdRubRate;
    }
}

function updateBuyTokens(val) {
    if (val === "" || val === null || val === undefined) {
        const usdEl = document.getElementById('buyUsdLabel');
        const rubEl = document.getElementById('buyRubLabel');
        if (usdEl) usdEl.textContent = "$0";
        if (rubEl) rubEl.textContent = "0 ₽";
        return;
    }
    const parsed = Math.max(1, Math.min(5000, Math.round(Number(val) || 1)));
    buyTokenCount = parsed;
    refreshBuyCalculatorUi(true);
}

function updateUsdRate(val) {
    const num = Number(val);
    if (!Number.isFinite(num) || num <= 0) return;
    usdRubRate = Math.round(num * 100) / 100;
    rateSourceLabel = "вручную";
    refreshBuyCalculatorUi(false);
}

async function fetchUsdRubRate() {
    try {
        const res = await fetch("https://open.er-api.com/v6/latest/USD");
        if (!res.ok) throw new Error("er-api error");
        const data = await res.json();
        const rub = Number(data?.rates?.RUB);
        if (Number.isFinite(rub) && rub > 10) {
            usdRubRate = Math.round(rub * 100) / 100;
            rateSourceLabel = "авто-курс";
            refreshBuyCalculatorUi(true);
            return;
        }
    } catch (e) {
        // Резервный источник курса
    }

    try {
        const res2 = await fetch("https://api.frankfurter.app/latest?from=USD&to=RUB");
        if (!res2.ok) throw new Error("frankfurter error");
        const data2 = await res2.json();
        const rub2 = Number(data2?.rates?.RUB);
        if (Number.isFinite(rub2) && rub2 > 10) {
            usdRubRate = Math.round(rub2 * 100) / 100;
            rateSourceLabel = "авто-курс";
            refreshBuyCalculatorUi(true);
        }
    } catch (e2) {
        // Оставляем базовый курс при офлайне
    }
}

if (window.Telegram?.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
}
render();
fetchUsdRubRate();
</script>
