<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ZION.CITY | Web 4.0 Ecosystem</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@300;400;500;600;700&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: #06080C;
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      min-height: 94vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: rgba(13, 17, 26, 0.95);
      border: 1px solid rgba(0, 242, 254, 0.25);
      border-radius: 24px;
      padding: 22px 18px;
      box-shadow: 0 0 35px rgba(0, 242, 254, 0.12);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 16px;
      margin-bottom: 18px;
    }

    .logo {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 22px;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #00F2FE, #FFFFFF, #D946EF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .menu-btn {
      background: rgba(0, 242, 254, 0.12);
      border: 1.5px solid rgba(0, 242, 254, 0.5);
      color: #00F2FE;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .card {
      background: rgba(20, 25, 38, 0.85);
      border: 1px solid rgba(217, 70, 239, 0.35);
      border-radius: 20px;
      padding: 24px 20px;
      margin: auto 0;
      box-shadow: 0 0 25px rgba(217, 70, 239, 0.18);
    }

    .badge {
      display: inline-block;
      background: rgba(0, 242, 254, 0.15);
      color: #00F2FE;
      border: 1px solid rgba(0, 242, 254, 0.35);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 14px;
      color: #FFFFFF;
    }

    p {
      font-size: 19px;
      color: #E2E8F0;
      line-height: 1.65;
      font-weight: 400;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 22px;
    }

    .btn-main {
      flex: 1;
      background: linear-gradient(90deg, #00F2FE, #D946EF);
      color: #06080C;
      font-weight: 800;
      font-size: 13px;
      text-transform: uppercase;
      padding: 16px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(0, 242, 254, 0.4);
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #F1F5F9;
      padding: 16px 20px;
      border-radius: 14px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: auto 0;
    }

    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(20, 25, 38, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 14px 18px;
      border-radius: 14px;
      color: #FFFFFF;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .slider-box {
      background: rgba(10, 13, 20, 0.7);
      border: 1px solid rgba(0, 242, 254, 0.35);
      padding: 16px;
      border-radius: 14px;
      margin-top: 12px;
    }

    input[type=range] {
      width: 100%;
      accent-color: #00F2FE;
      margin: 14px 0;
    }

    .footer {
      text-align: center;
      font-size: 10px;
      color: #64748B;
      font-family: monospace;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <div class="logo">ZION.CITY</div>
      <button class="menu-btn" id="toggleMenuBtn" onclick="toggleMenu()">📱 Меню</button>
    </div>

    <div id="contentArea"></div>

    <div class="footer">ZION.CITY WEB 4.0 • POWERED BY E.R.I.C. AI</div>
  </div>

  <script>
    let currentStep = 1;
    let isMenuOpen = false;
    let tokenCount = 100;

    const totalTokens = 35000000;
    const annualTransactions = 31536000000;
    const avgFee = 0.20;
    const revenuePerToken = (annualTransactions * avgFee) / totalTokens;

    const stepsData = [
      {
        badge: "Главный архитектор",
        title: "А ты хотел бы иметь дополнительный доход, который не зависит от твоей ежедневной работы?",
        text: "Привет! Я Роберт — главный архитектор социально-финансово-экономической системы ZION.CITY. Сегодня я покажу тебе необычную экономическую модель, в которой участники получают пассивный доход от работы нашей цифровой инфраструктуры. Представь: пока ты занимаешься своими делами, твой суверенный актив участвует в реальном товарообороте и приносит постоянный доход."
      },
      {
        badge: "Концепция",
        title: "А твои деньги могут работать вместо тебя и на тебя?",
        text: "А что если твои деньги начнут работать на тебя без твоего постоянного участия? Вместо того чтобы быть просто потребителем чужих сервисов, ты становишься равноправным совладельцем цифровой среды. Ты живешь, путешествуешь и проводишь время с близкими, а принадлежащая тебе нода верифицирует транзакции сети и генерирует дивиденды."
      },
      {
        badge: "Проблема Web 2.0",
        title: "В чём проблема современных платформ?",
        text: "В чём главный изъян современных цифровых платформ? Мы создаём контент, совершаем покупки и переводы, но всю прибыль забрали монополии «золотого миллиарда». ZION.CITY меняет эти правила раз и навсегда. Мы устранили посредников и возвращаем 100% комиссии людям, поддерживающим сеть."
      },
      {
        badge: "Экосистема Web 4.0",
        title: "Единая цифровая среда нового поколения",
        text: "Мы создали суверенное пространство для жизни и бизнеса, разделенное на 8 функциональных модулей. Общение, покупки, ИИ-агент ERIC AI, госуслуги и финансы теперь находятся в одной удобной среде под контролем единого профиля. Никакой спам-рекламы и слежки — инфраструктура работает на безопасность и экономию ресурсов каждого участника."
      },
      {
        badge: "Модель дохода",
        title: "Принцип совладения инфраструктурой",
        text: "Принцип совладения инфраструктурой прост и прозрачен. Каждый перевод, покупка или торговая операция в сети формирует небольшую комиссию (от 0,1% до 0,5%). Весь чистый доход платформы автоматически распределяется среди владельцев Altyn Token. Использование интернета становится твоим личным бизнесом."
      },
      {
        badge: "Altyn Token",
        title: "Главный актив экосистемы",
        text: "Altyn Token — это главный инфраструктурный актив всей экосистемы. Его эмиссия строго ограничена математическим алгоритмом — всего 35 000 000 единиц. Никакого печатного станка и инфляции. Владея токенами и размещая их в нодах, ты становишься «акционером цифрового центрального банка»."
      },
      {
        badge: "Источники",
        title: "Откуда берутся деньги?",
        text: "Наш источник дохода — не привлечение новых участников, как в пирамидах или МЛМ-схемах, а реальный товарооборот и платежи внутри инфраструктуры. Оплата товаров, услуг, трансграничные расчеты БРИКС+ и покупка ресурсов дают постоянный физический денежный поток."
      },
      {
        badge: "Два инструмента",
        title: "Token & Coin",
        text: "Мы разделили капитал и расчеты для абсолютной стабильности. Altyn Token — это недевальвируемый капитал, дающий право на получение дивидендов со всех транзакций. Altyn Coin — быстрая и стабильная монета без волатильности для повседневных покупок, бизнеса и мобильных платежей."
      },
      {
        badge: "Экономика сети",
        title: "Прозрачная математика и расчеты",
        text: "В ZION.CITY мы строим экономику не на спекулятивных обещаниях, а на строгой математике и законодательном контуре РФ (ФЗ № 259-ФЗ о ЦФА). Система интегрирована с государственными стандартами и договоренностями со странами ЕАЭС, ШОС и БРИКС+. Токен работает как суверенный цифровой актив (ЦФА): держатели нод верифицируют транзакции и распределяют между собой 100% комиссионного потока."
      },
      {
        badge: "Калькулятор",
        title: "Бухгалтерия заработка совладельца",
        isCalculator: true,
        text: "Давайте обратимся к цифрам. При консервативной нагрузке всего в 1 000 транзакций/сек ($31,5 млрд операций в год) и средней комиссии в $0,20 сеть генерирует порядка $6,3 млрд в год. Разделив эту сумму на 35 млн токенов, мы получаем более $180 пассивного дохода на 1 Altyn Token в год. Имея базовый пакет в 100 токенов, ты получаешь от $18 000 дивидендов ежегодно. Для старта доступны и частичные доли токена."
      },
      {
        badge: "Масштабы",
        title: "Потенциал участия",
        text: "Население России — 144,1 млн человек. Взрослое платежеспособное население (18+) составляет 2/3 — около 96 млн человек. Если на старте системой будут ежедневно пользоваться хотя бы 1-2% от этого числа, активная база составит от 960 000 до 1 920 000 человек. Это обеспечит постоянную нагрузку от 11 до 22 транзакций в секунду на старте с огромным потенциалом роста на весь рынок БРИКС+."
      },
      {
        badge: "Твое будущее — твой выбор",
        title: "Экосистема для жизни и свободы",
        text: "ZION.CITY — это экосистема для реальной жизни, свободы и безопасности. Мы создали финансовый суверенитет, где технология бережет твое время и ресурсы для семьи, творчества и гармонии. Система работает в полном согласии с правовыми нормами, гарантируя сохранность и прозрачность твоего капитала."
      },
      {
        badge: "Финал",
        title: "Добро пожаловать в ZION.CITY!",
        text: "Мы не обещаем мгновенного богатства, а предлагаем сделать осознанный выбор и стать совладельцем цифровой экономики. Изучите материалы, оцените математику и присоединяйтесь к новой народной экономике ZION.CITY!"
      }
    ];

    function render() {
      const area = document.getElementById('contentArea');
      const btnText = document.getElementById('toggleMenuBtn');

      if (isMenuOpen) {
        btnText.innerText = "✖ Закрыть";
        area.innerHTML = `
          <div class="menu-list">
            <div style="text-align: center; margin-bottom: 6px;">
              <h2 style="font-size: 15px; font-weight: 800; color: #fff;">НАВИГАЦИЯ ПО ZION.CITY</h2>
            </div>
            <a href="https://zioncity.app" target="_blank" class="menu-item">🌐 1. Регистрация в ZION.CITY <span>→</span></a>
            <div class="menu-item" onclick="openCalc()">📊 2. Калькулятор доходности <span>Открыть</span></div>
            <a href="https://apps.apple.com/kz/app/zion-city/id6802460387?l=ru" target="_blank" class="menu-item">🍏 3. Скачать для iOS <span>App Store</span></a>
            <div class="menu-item" onclick="alert('Приложение для Android находится на проверке в Google Play')">🤖 4. Скачать для Android <span>На проверке</span></div>
            <a href="https://www.youtube.com/watch?v=BpijzlycmGg&list=PLdBEtP9Ov1XE" target="_blank" class="menu-item">📚 5. База знаний <span>YouTube</span></a>
            <a href="https://youtu.be/0unuFi8VwbU?si=KDzN1k9kpLZjdkoS" target="_blank" class="menu-item">💱 6. Валюта ЕАЭС <span>Video</span></a>
            <a href="https://zion-tech-portal.vercel.app/" target="_blank" class="menu-item">🎓 7. Академия ZION.CITY <span>открывать на ПК</span></a>
          </div>
        `;
        return;
      }

      btnText.innerText = "📱 Меню";
      const item = stepsData[currentStep - 1];

      let calcHtml = '';
      if (item.isCalculator) {
        const income = Math.round(tokenCount * revenuePerToken);
        calcHtml = `
          <div class="slider-box">
            <div style="display:flex; justify-content:space-between; font-size:14px; margin-bottom:8px;">
              <span style="color:#94A3B8">Ваш пакет:</span>
              <span style="color:#00F2FE; font-weight:bold;">${tokenCount} ALTYN</span>
            </div>
            <input type="range" min="1" max="1000" value="${tokenCount}" oninput="updateTokens(this.value)" />
            <div style="display:flex; justify-content:space-between; font-size:14px; margin-top:10px; border-top:1px solid rgba(255,255,255,0.1); padding-top:10px;">
              <span style="color:#94A3B8">Прогноз доход/год:</span>
              <span style="color:#10B981; font-weight:900; font-size:17px;">$${income.toLocaleString()}</span>
            </div>
          </div>
        `;
      }

      area.innerHTML = `
        <div style="margin-bottom: 10px; font-size: 12px; color: #94A3B8; font-family: monospace;">
          ШАГ ${currentStep} ИЗ ${stepsData.length}
        </div>
        <div class="card">
          <div class="badge">${item.badge}</div>
          <h1>${item.title}</h1>
          ${item.text ? `<p>${item.text}</p>` : ''}
          ${calcHtml}
        </div>
        <div class="actions">
          ${currentStep > 1 ? `<button class="btn-back" onclick="prevStep()">← Назад</button>` : ''}
          <button class="btn-main" onclick="nextStep()">${currentStep < stepsData.length ? 'Читать далее →' : 'Открыть главное меню 🚀'}</button>
        </div>
      `;
    }

    function nextStep() {
      if (window.Telegram?.WebApp?.HapticFeedback) {
        window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
      }
      if (currentStep < stepsData.length) {
        currentStep++;
        render();
      } else {
        toggleMenu();
      }
    }

    function prevStep() {
      if (window.Telegram?.WebApp?.HapticFeedback) {
        window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
      }
      if (currentStep > 1) {
        currentStep--;
        render();
      }
    }

    function toggleMenu() {
      isMenuOpen = !isMenuOpen;
      render();
    }

    function openCalc() {
      isMenuOpen = false;
      currentStep = 10;
      render();
    }

    function updateTokens(val) {
      tokenCount = Number(val);
      render();
    }

    if (window.Telegram?.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    render();
  </script>
</body>
</html>
